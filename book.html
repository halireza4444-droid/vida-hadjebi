  <script>
  (function () {

    var BOOKS = {

      'pari': {
        title: 'پری در خاطره دوستانش',
        cover: 'assets/images/book-pari.jpg',
        coverAlt: 'جلد کتاب پری در خاطره دوستانش',
        meta: [
          { label: 'گردآوری و تنظیم', value: 'ویدا حاجبی' },
          { label: 'طرح روی جلد',      value: 'نقاشی پری، خط منوچهر مقتدر' },
          { label: 'صحافی و چاپ',      value: 'باقر مرتضوی' },
          { label: 'چاپ اول',           value: 'اردیبهشت ۱۳۸۳ / مه ۲۰۰۲' }
        ],
        pdf: 'assets/book-pari.pdf',
        content: '<h2 class="book-h2">دربارهٔ پری</h2>' +
          '<p>پری حاجبی (۱۳۱۰–۱۳۷۸) نقاش و هنرمند ایرانی بود. این کتاب گردآوری خاطرات و یادمان‌های دوستان و نزدیکان اوست که ویدا حاجبی آن را تنظیم و منتشر کرده است.</p>' +
          '<figure class="book-inline-figure"><img src="assets/images/book-pari-painting.jpg" alt="نقاشی پری حاجبی" /></figure>' +
          '<h2 id="book-excerpt" class="book-h2">بخشی از کتاب</h2>' +
          '<blockquote class="book-excerpt"><p>«دم در سالن ایستاده بودم و به رنگارنگی فضا خیره مانده بودم، شگفت‌زده و سوگوار آنچه از دست داده بودم. انگار فقط پری قادر بود با مرگ خودش این ترکیب رنگارنگ و ناهمگون از یاران دیرینش را در فضایی از صمیمیت، بازآفریند. محفلی بود پر از صفا، همراه با باده و موسیقی و آواز، با خاطره‌های بی غل و غش و شادی‌آفرین. همان فضایی که پری همواره خواهان و جویایش بود؛ به روزگاری محافلی از این دست را، پیش از گرفتار شدن در ناملایمات بیماری دراز مدت، برای دوستانش آراسته.»</p></blockquote>',
        others: ['dad-1', 'dad-2', 'ramin', 'yadha']
      },

      'dad-1': {
        title: 'داد بی‌داد — جلد اول',
        cover: 'assets/images/book-dad-1.jpg',
        coverAlt: 'جلد کتاب داد بی‌داد جلد ۱',
        meta: [
          { label: 'نویسنده',    value: 'ویدا حاجبی تبریزی' },
          { label: 'انتشارات',   value: 'بازتاب نگار' },
          { label: 'دسته‌بندی',  value: 'تاریخ معاصر ایران، خاطرات، مجموعه داد بی‌داد' },
          { label: 'سال انتشار', value: '۱۳۸۳ هجری شمسی، ۲۰۰۴ میلادی' }
        ],
        pdf: 'assets/book-dad-1.pdf',
        content: '<h2 id="book-excerpt" class="book-h2">از مقدمه نویسنده</h2>' +
          '<blockquote class="book-excerpt">' +
          '<p>«سرانجام پس از چند سال بحران فکری، تردیدها و دودلی‌هایم نسبت به دکم‌ها و اراده‌گرایی‌های گذشته و شیوه‌های مبارزه با رژیم شاه، شکلی نسبتاً منسجم و مشخص به خود گرفت. رفته‌رفته، سنجش گذشته برایم معنا و اهمیت پیدا کرد و در ذهنم به موضوعی ضروری تبدیل شد.</p>' +
          '<p>در این حال و هوا، بار دیگر به فکر نوشتن دربارهٔ زندان افتادم. این بار بدون دغدغهٔ خاطر پذیرفته بودم که زندان زنان سیاسی، بخشی از تاریخ سیاسی جامعه ماست. اما دیگر درپی آن نبودم که به تحلیل و برداشت خودم اکتفا کنم. گرچه گفتنی کم نداشتم. در پی آن بودم که بدانم همبندان سابقم، پس از بیست سال چه خاطره، چه برداشت و چه تحلیلی از آن سال‌ها دارند.»</p>' +
          '</blockquote>',
        others: ['pari', 'dad-2', 'ramin', 'yadha']
      },

      'dad-2': {
        title: 'داد بی‌داد — جلد دوم',
        cover: 'assets/images/book-dad-2.jpg',
        coverAlt: 'جلد کتاب داد بی‌داد جلد ۲',
        meta: [
          { label: 'به کوشش',       value: 'ویدا حاجبی تبریزی' },
          { label: 'دسته‌بندی',     value: 'سیاسی زنان ۱۳۵۰–۱۳۸۷' },
          { label: 'طرح روی جلد',   value: 'حسن قاضی، با الهام از طرح یک زندانی سیاسی (۱۳۵۷)' },
          { label: 'صفحه‌آرایی',    value: 'رامین حاجبی' },
          { label: 'انتشارات',      value: 'Forough Book' }
        ],
        pdf: 'assets/book-dad-2.pdf',
        content: '<h2 id="book-excerpt" class="book-h2">از مقدمه</h2>' +
          '<blockquote class="book-excerpt">' +
          '<p>«باتهیه و تنظیم این کتاب، من نیز زندان را دوباره زیستم، با دلهره‌ها و نگرانی‌هایش. این را هم بهتر فهمیدم که آدمی در وضعیت‌های دشوار از چه ظرفیت‌های نهفته‌ای برای پایداری برخوردار است، بی‌آنکه در پی قهرمان شدن باشد یا اسطوره شدن.</p>' +
          '<p>با این همه، تجربهٔ زندان را با بازگویی آن، نمی‌توان به تمامی به دیگری منتقل کرد. زمانی با مشاهدهٔ شقاوت‌های شکنجه‌گران ساواک، از خود می‌پرسیدم حد سبعیت و درندگی انسان تا کجاست؟ امروز با آشکار شدن آنچه بر سر هزاران هزار زندانی در زندان‌های جمهوری اسلامی طی ۲۵ سال گذشته آمده، می‌توان گفت که سقوط آدمی نهایتی ندارد. باشد که انتقال تجربهٔ بی‌دادها، در هر شکلی از بی‌داد، بتواند افق‌های گسترده‌تری به روی جامعهٔ ما که قرن‌ها زیر فشار استبداد سیاسی و فرهنگ ریشه‌دار سنتی‌ـ‌مذهبی زیسته، بگشاید.»</p>' +
          '</blockquote>',
        others: ['pari', 'dad-1', 'ramin', 'yadha']
      },

      'ramin': {
        title: 'قصه‌ی رامین',
        cover: 'assets/images/book-ramin.jpg',
        coverAlt: 'جلد کتاب قصه‌ی رامین',
        meta: [
          { label: 'گردآوری، ترجمه و تنظیم', value: 'ویدا حاجبی تبریزی' },
          { label: 'طرح روی جلد',             value: 'آزاده نیلجیانی' },
          { label: 'خوشنویسی',                value: 'یونس فقیهی' },
          { label: 'صفحه‌آرایی',              value: 'سپیده شیرزاد، آزاده نیلجیانی' },
          { label: 'چاپ و صحافی',             value: 'خاوران' },
          { label: 'چاپ دوم',                 value: 'مهر ۱۳۹۵' }
        ],
        pdf: 'assets/book-ramin.pdf',
        content: '<h2 id="book-excerpt" class="book-h2">از مقدمه</h2>' +
          '<blockquote class="book-excerpt">' +
          '<p>«سرانجام تحت تأثیر نگاه با فاصله و شکیبایی او به فکر روندهای سیاسی گذشته افتادم. تدوین کتاب داد بی‌داد / نخستین زندان سیاسی زنان را به هوشدارهای پسرم رامین مدیونم. اکنون یاری باصفا و آموزگاری بی‌ادعا و بی‌همتایی را از دست داده‌ام که برغم همهٔ جابه‌جایی‌ها و ماجراهای سختی که بر او تحمیل کردم و تحمیل شد، وجودش تحقق این آرزوی حکیمانه بود: از توان پر صفایی برخوردار بود تا آنچه نمی‌شود تغییر داد بپذیرد، و از شجاعتی تا آنچه می‌شود تغییر داد، تغییر دهد و به خِردی دست‌یافته بود تا این دو را از هم تشخیص دهد.»</p>' +
          '</blockquote>',
        others: ['pari', 'dad-1', 'dad-2', 'yadha']
      },

      'yadha': {
        title: 'یادها — جلد اول',
        cover: 'assets/images/book-yadha.jpg',
        coverAlt: 'جلد کتاب یادها',
        meta: [
          { label: 'نویسنده',      value: 'ویدا حاجبی تبریزی' },
          { label: 'طرح روی جلد', value: 'آزاده نیلجیانی' },
          { label: 'خط',           value: 'منوچهر مقتدر' },
          { label: 'صفحه‌آرایی',  value: 'رامین حاجبی' },
          { label: 'صحافی و چاپ', value: 'باقر مرتضوی' },
          { label: 'پخش',          value: 'Forough Book' }
        ],
        pdf: 'assets/book-yadha.pdf',
        content: '<h2 id="book-excerpt" class="book-h2">بخشی از کتاب</h2>' +
          '<blockquote class="book-excerpt">' +
          '<p>«در آن لحظهٔ هولناک چهار–پنج ساله بودم. هنگامی که در کوچهٔ تنگ و خاکی محل زندگیمان، دروازه شمیران، آران محله چادر دایهٔ دوست‌داشتنی و مهربانم، فاطمه سلطان، را از سرش کشید و بی‌اعتنا به التماس‌ها و گریه‌زاری‌اش چادرش را پاره کرد و ریخت توی جوی آب پر از آشغال کنار کوچه. وحشت‌زده و گریان که به خانه رسیدم، پدرم در آغوشم گرفت و گفت: «آران خیلی کار بدی کرده اما همیشه یادت باشه که چادر چیز خوبی نیست و زن‌هارو بی‌دست‌وپا و ضعیف می‌کنه!»</p>' +
          '<p>به عمق حرف پدرم تنها زمانی پی بردم که سرنوشت جامعه به گونه‌ای دیگر رقم خورد. آنچه رضا شاه، در پی انقلاب مشروطه، به زور از سر دایه‌ام برداشت، در پی انقلابی اسلامی می‌خواستند به زور بر سر من بگذارند.»</p>' +
          '</blockquote>',
        others: ['pari', 'dad-1', 'dad-2', 'ramin']
      }
    };

    var ALL_COVERS = {
      'pari':  { src: 'assets/images/book-pari.jpg',  alt: 'پری در خاطره دوستانش' },
      'dad-1': { src: 'assets/images/book-dad-1.jpg', alt: 'داد بی‌داد جلد ۱' },
      'dad-2': { src: 'assets/images/book-dad-2.jpg', alt: 'داد بی‌داد جلد ۲' },
      'ramin': { src: 'assets/images/book-ramin.jpg', alt: 'قصه‌ی رامین' },
      'yadha': { src: 'assets/images/book-yadha.jpg', alt: 'یادها' }
    };

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function buildMeta(items) {
      return items.map(function(item) {
        return '<div><dt>' + item.label + ':</dt><dd>' + item.value + '</dd></div>';
      }).join('');
    }

    function buildOtherBooks(ids) {
      return ids.map(function(id) {
        var c = ALL_COVERS[id];
        if (!c) return '';
        return '<article class="book-card"><a href="book.html?id=' + id + '"><img src="' + c.src + '" alt="' + c.alt + '" /></a></article>';
      }).join('');
    }

    function renderBook() {
      var id = getParam('id') || 'dad-1';
      var book = BOOKS[id] || BOOKS['dad-1'];

      document.title = book.title + ' — ویدا حاجبی';

      var page = document.getElementById('bookPage');
      page.innerHTML =
        '<section class="book-hero section">' +
          '<div class="container book-hero-grid">' +
            '<figure class="book-hero-cover">' +
              '<img src="' + book.cover + '" alt="' + book.coverAlt + '" />' +
            '</figure>' +
            '<div class="book-hero-text">' +
              '<h1 class="book-title">' + book.title + '</h1>' +
              '<dl class="book-meta">' + buildMeta(book.meta) + '</dl>' +
              '<div class="book-actions">' +
                (book.pdf ? '<a href="' + book.pdf + '" target="_blank" rel="noopener" class="btn-buy">دانلود کتاب</a>' : '') +
                '<a href="#book-excerpt" class="btn btn-pill">' +
                  '<span>بخشی از کتاب</span>' +
                  '<img src="assets/images/icon-arrow-left.svg" alt="" class="btn-icon" />' +
                '</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<section class="book-content section">' +
          '<div class="container book-content-inner">' + book.content + '</div>' +
        '</section>' +
        '<section class="section other-books">' +
          '<div class="container">' +
            '<h2 class="section-title">دیگر کتاب‌ها</h2>' +
            '<div class="books-grid">' + buildOtherBooks(book.others) + '</div>' +
          '</div>' +
        '</section>';
    }

    renderBook();
  })();
  </script>
</body>
